<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NCR Express - สร้างรายการจัดส่ง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK v2 -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Leaflet Map สำหรับปักหมุด GPS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    #pickerMap { height: 180px; width: 100%; border-radius: 0.75rem; z-index: 10; }
  </style>
</head>
<body class="bg-slate-100 p-3 text-slate-800 antialiased">
  <div class="max-w-md mx-auto bg-white rounded-3xl p-5 shadow-xl border border-slate-200/80 space-y-4">
    
    <!-- ส่วนหัวฟอร์ม -->
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-md shadow-blue-500/30">
          NCR
        </div>
        <div>
          <h1 class="text-sm font-bold text-slate-900 leading-tight">สร้างรายการจัดส่งพัสดุ</h1>
          <p class="text-[11px] text-slate-400">กรอกข้อมูลเพื่อประเมินค่าจัดส่งและคิวรถ</p>
        </div>
      </div>
      <span id="userProfileName" class="text-[10px] font-mono bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full font-semibold">
        กำลังโหลด...
      </span>
    </div>

    <form id="bookingForm" class="space-y-3 text-xs">
      <!-- 1. ประเภทงาน (ไปส่ง / ไปรับ) -->
      <div>
        <label class="block font-semibold text-slate-700 mb-1">ประเภทงานขนส่ง *</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="btn-delivery" onclick="setJobType('delivery')" class="py-2 px-3 rounded-xl border-2 font-bold transition flex items-center justify-center gap-1.5 bg-emerald-50 border-emerald-500 text-emerald-800">
            🚚 ไปส่งพัสดุ
          </button>
          <button type="button" id="btn-pickup" onclick="setJobType('pickup')" class="py-2 px-3 rounded-xl border-2 font-bold transition flex items-center justify-center gap-1.5 bg-slate-50 border-slate-200 text-slate-500">
            📦 ไปรับพัสดุ
          </button>
        </div>
        <input type="hidden" id="jobType" value="delivery">
      </div>

      <!-- 2. ข้อมูลผู้รับ / จุดส่ง -->
      <div class="space-y-2">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">ชื่อผู้ติดต่อ / ผู้รับ *</label>
          <input type="text" id="receiverName" required placeholder="เช่น คุณวิภาดา สุรนารี" class="w-full p-2.5 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 focus:bg-white text-xs">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">เบอร์โทรศัพท์ติดต่อ *</label>
          <input type="tel" id="receiverPhone" required placeholder="08X-XXX-XXXX" class="w-full p-2.5 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 font-mono bg-slate-50 focus:bg-white text-xs">
        </div>
      </div>

      <!-- 3. ที่อยู่ & แผนที่ปักหมุด GPS -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="font-semibold text-slate-700">ปักหมุดพิกัดปลายทาง (GPS) *</label>
          <span class="text-[10px] text-blue-600 cursor-pointer" onclick="useCurrentLocation()">📍 ใช้ตำแหน่งปัจจุบัน</span>
        </div>
        <div id="pickerMap" class="mb-2"></div>
        <div class="grid grid-cols-2 gap-2 text-[10px] font-mono text-slate-400 mb-1.5">
          <span>Lat: <b id="displayLat" class="text-slate-700">14.9971</b></span>
          <span>Lng: <b id="displayLng" class="text-slate-700">102.1160</b></span>
        </div>
        <textarea id="address" rows="2" required placeholder="รายละเอียดที่อยู่ / ชื่ออาคาร / ซอย / สังเกต..." class="w-full p-2.5 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 focus:bg-white text-xs"></textarea>
      </div>

      <!-- 4. น้ำหนัก & สิ่งของ -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">รายการสิ่งของ</label>
          <input type="text" id="item" placeholder="เช่น อะไหล่ / ผลไม้" class="w-full p-2.5 rounded-xl border border-slate-200 outline-none text-xs bg-slate-50">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">น้ำหนัก (kg)</label>
          <input type="number" id="weight" step="0.5" value="2.0" class="w-full p-2.5 rounded-xl border border-slate-200 outline-none font-mono text-xs bg-slate-50">
        </div>
      </div>

      <!-- ปุ่มยืนยัน -->
      <div class="pt-2">
        <button type="submit" id="submitBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-lg shadow-blue-500/30 transition text-xs flex items-center justify-center gap-2 cursor-pointer">
          <span>ยืนยันการจัดส่ง (ประเมินราคาเรียลไทม์)</span>
        </button>
      </div>
    </form>
  </div>

  <script>
    const MY_LIFF_ID = "2011573969-pn9hzSzG";
    let map, marker;
    let currentLat = 14.997172; // ค่าเริ่มต้น เซ็นทรัลโคราช
    let currentLng = 102.116034;

    async function initLiff() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          document.getElementById('userProfileName').innerText = profile.displayName;
        } else {
          document.getElementById('userProfileName').innerText = 'LINE Guest';
        }
      } catch (err) {
        console.error("LIFF Init Error:", err);
        document.getElementById('userProfileName').innerText = 'Web Mode';
      }
    }

    function initMap() {
      map = L.map('pickerMap').setView([currentLat, currentLng], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      marker = L.marker([currentLat, currentLng], { draggable: true }).addTo(map);

      marker.on('dragend', function (e) {
        const pos = e.target.getLatLng();
        updateCoords(pos.lat, pos.lng);
      });

      map.on('click', function (e) {
        marker.setLatLng(e.latlng);
        updateCoords(e.latlng.lat, e.latlng.lng);
      });
    }

    function updateCoords(lat, lng) {
      currentLat = lat;
      currentLng = lng;
      document.getElementById('displayLat').innerText = lat.toFixed(4);
      document.getElementById('displayLng').innerText = lng.toFixed(4);
    }

    function useCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          map.setView([lat, lng], 15);
          marker.setLatLng([lat, lng]);
          updateCoords(lat, lng);
        }, () => alert("ไม่สามารถดึง GPS ได้ กรุณาเลื่อนหมุดบนแผนที่"));
      }
    }

    function setJobType(type) {
      document.getElementById('jobType').value = type;
      const btnDeliv = document.getElementById('btn-delivery');
      const btnPick = document.getElementById('btn-pickup');
      if (type === 'delivery') {
        btnDeliv.className = "py-2 px-3 rounded-xl border-2 font-bold transition flex items-center justify-center gap-1.5 bg-emerald-50 border-emerald-500 text-emerald-800";
        btnPick.className = "py-2 px-3 rounded-xl border-2 font-bold transition flex items-center justify-center gap-1.5 bg-slate-50 border-slate-200 text-slate-500";
      } else {
        btnPick.className = "py-2 px-3 rounded-xl border-2 font-bold transition flex items-center justify-center gap-1.5 bg-amber-50 border-amber-500 text-amber-800";
        btnDeliv.className = "py-2 px-3 rounded-xl border-2 font-bold transition flex items-center justify-center gap-1.5 bg-slate-50 border-slate-200 text-slate-500";
      }
    }

    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "กำลังบันทึกข้อมูล...";

      const payload = {
        orderId: "ORD-" + Date.now().toString().slice(-6),
        jobType: document.getElementById('jobType').value,
        receiverName: document.getElementById('receiverName').value,
        receiverPhone: document.getElementById('receiverPhone').value,
        address: document.getElementById('address').value,
        item: document.getElementById('item').value || 'พัสดุทั่วไป',
        weight: parseFloat(document.getElementById('weight').value) || 1.0,
        lat: currentLat,
        lng: currentLng,
        timestamp: new Date().toISOString()
      };

      // ส่งเข้า Backend หรือ Database โดยตรง (ตัวอย่าง fetch เข้า API)
      console.log("Order Data:", payload);
      alert(`✅ บันทึกออเดอร์ ${payload.orderId} สำเร็จ!`);

      // ปิดหน้าต่าง LIFF กลับสู่ห้องแชท LINE
      if (liff.isInClient()) {
        liff.closeWindow();
      } else {
        btn.disabled = false;
        btn.innerText = "บันทึกเรียบร้อย (ปิดหน้านี้ได้เลย)";
      }
    });

    window.onload = () => {
      initLiff();
      initMap();
    };
  </script>
</body>
</html>
